name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar (Electron, yt-dlp y ffmpeg)
        run: npm install
      - name: Herramientas descargadas
        run: |
          ls bin
          node -e "require('./main/tools').findFfmpeg('', ['bin']).then(r => { if (!r) process.exit(1); console.log(r.bin, r.version) })"
          node -e "require('./main/tools').findYtdlp(['bin']).then(r => { if (!r) process.exit(1); console.log(r.bin, r.version) })"
      - name: Pruebas rápidas
        run: |
          node scripts/test-platform.js ffmpeg
          node scripts/test-platform.js browsers
          node scripts/test-platform.js ci
          node scripts/test-installers.js config
          node scripts/test-installers.js workflow
          node scripts/test-install-linux.js config
          node scripts/test-install-linux.js script
          node scripts/test-updater.js unit
          node scripts/test-brand.js files
          for m in popularity insert engine; do node --experimental-default-type=module scripts/test-automix-add.js $m; done
          for m in plan engine; do node --experimental-default-type=module scripts/test-mix-now.js $m; done
          node scripts/test-layouts.js unit
          node scripts/test-video-local.js detect
          for m in chain prepare; do node --experimental-default-type=module scripts/test-queue-order.js $m; done
          node --experimental-default-type=module scripts/test-mix-edit.js store
          node scripts/test-auth-import.js
          node scripts/test-ytdlp-sin-sesion.js settings
          node scripts/test-ytdlp-sin-sesion.js args
          node scripts/test-save-library.js settings
          for m in queue prepare mixnow; do node --experimental-default-type=module scripts/test-automix-view.js $m; done
          for m in structure tempo plan pick engine reanalyze; do node scripts/test-mix-points.js $m; done
      - name: Arranque de la app (Linux, pantalla virtual)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo chown root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run -a node scripts/test-login-flow.js
          xvfb-run -a node scripts/test-updater.js ui
          xvfb-run -a node scripts/test-brand.js e2e
      - name: Arranque de la app (Windows y macOS)
        if: runner.os != 'Linux'
        run: |
          node scripts/test-login-flow.js
          node scripts/test-updater.js ui
          node scripts/test-brand.js e2e
      - name: Paquete de la app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/test-installers.js packaged
      - name: Paquete de la app (Windows y macOS)
        if: runner.os != 'Linux'
        run: node scripts/test-installers.js packaged
